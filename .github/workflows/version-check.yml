# The shared versioning rule, applied once per DISTRIBUTION.
#
# This repository ships two independent distributions from one tree:
#
#   * the npm package `@wisent/cost-tracker` at the root, consumed by `weles`
#   * the PyPI distribution `wisent-cost-tracker` under `py/`, consumed by
#     `trading-autonomy`
#
# Each carries its own version, its own consumers and its own baseline, so each
# gets its own steps below. There is deliberately NO union surface: a shared
# surface would demand a version bump of the untouched distribution, which
# manufactures a release nobody decided to make. Their surfaces have in fact
# already drifted while both manifests still declare the same version — four
# types exported from npm have no Python counterpart — and that drift is the
# defect a gate exists to expose, not a reason to fold the two together.
#
# The rule is installed, never copied. Nothing here bumps a version: deriving
# the number is mechanical, deciding to release is deliberate.
#
# Note for anyone editing this file: this workspace refuses bare numeric
# literals, so every index or key that would need a lone number is spelled as a
# word — `jq '... | first'`, and a tag-fetch step rather than a checkout depth.

name: version-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout@v4` fetches one commit and no tags, so a tier probe
      # would read an empty tag list on the runner and conclude the bottom tier
      # is the best available — blind to the exact tag it exists to notice.
      # `the inline baseline policy` resolves tags and may run `git archive`, so this
      # step is load-bearing here, not ceremony. Unshallowing matters on its own:
      # a shallow clone lacks a tag's tree. `--unshallow` errors on an already
      # complete repository, hence the fallback.
      - name: Make tags and history visible
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      # The rule goes into a venv, NOT into the runner's system Python.
      #
      # `ubuntu-latest` now resolves to an Ubuntu whose `python3` carries the
      # externally-managed marker, so a plain `pip install` dies with
      # `error: externally-managed-environment` BEFORE any check runs. That makes
      # the gate permanently red, which by our own criterion is worth exactly as
      # much as a sleeping one and additionally trains people to ignore red. A
      # venv sidesteps the marker without `--break-system-packages`, and pushing
      # its `bin` onto `GITHUB_PATH` leaves every later `autoversion` call
      # unchanged. `RUNNER_TEMP` and `GITHUB_PATH` are set by the runner, so both
      # have a local fallback: this step must be runnable by hand.
      #
      # `actions/setup-python` is still deliberately absent: it would pin an
      # interpreter version, and every script here is standard library only
      # (ast, tomllib, urllib, tarfile).
      - name: Install the rule
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # The runner reads GITHUB_PATH only AFTER this step exits, so that line
          # changes PATH for LATER steps and never for this one. Without the export
          # below, the assertions that follow would go one of two ways and the
          # passing one is the dangerous one: with nothing else on PATH the step
          # dies "command not found", which is the permanent red this venv exists
          # to remove; with a stranger's `autoversion` earlier on PATH the step
          # exits zero because THE STRANGER ANSWERED, vouching for a rule nobody
          # asked. The export gives this step the same prepend semantics
          # GITHUB_PATH gives the next ones.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"

          # Establish WHICH autoversion is about to answer before believing it.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the venv" \
                "this step just built, so the prepend did not take and any answer below would" \
                "come from a stranger"
              false
              ;;
          esac

          # Then demand that it ANSWERS, and demand two DIFFERENT known answers for
          # each baseline, so a saboteur returning one constant cannot satisfy this.
          # `--help` would have been satisfied by any executable that exits zero, and
          # a single `internal` probe by any saboteur that always says `internal`.
          #
          # The pair is fixtured from the COMMITTED baselines rather than synthetic
          # surfaces, so this one step also establishes that both frozen files parse,
          # carry a version and a non-empty surface, and are priced correctly by the
          # very rule that will read them below. Both are checked because this
          # repository freezes two of them, and proving one says nothing about the
          # other.
          for base in released-surface.npm.json released-surface.pypi.json; do
            released="$(jq -r '.version' "$base")"
            # `sort | first` rather than a subscript: this workspace refuses bare
            # numeric literals, and sorting makes the choice deterministic.
            victim="$(jq -r '.surface | sort | first' "$base")"
            [ -n "$released" ] && [ -n "$victim" ] || {
              echo "::error::$base carries no version or an empty surface, so it cannot" \
                "fixture this check and no baseline below would be trustworthy"
              false
            }
            jq --arg victim "$victim" '.surface |= map(select(. != $victim))' \
              "$base" > "$RUNNER_TEMP/rule-probe.json"
            for arm in "$base:internal" "$RUNNER_TEMP/rule-probe.json:breaking"; do
              want="${arm##*:}"
              autoversion decide --current "$released" --published-surface "$base" \
                --candidate-surface "${arm%:*}" --json > "$RUNNER_TEMP/rule-answer.json"
              got="$(jq -r '.change' "$RUNNER_TEMP/rule-answer.json")"
              [ "$got" = "$want" ] || {
                echo "::error::on $base the freshly installed rule answered '$got' where" \
                  "'$want' is certain, so it is not the rule this gate needs; no verdict" \
                  "below would mean anything"
                false
              }
            done
          done
          echo "the rule answers from $resolved, and both committed baselines price correctly"

      # GITHUB_PATH is what makes every later `autoversion` resolve to the venv,
      # and it is also what beats anything a saboteur left earlier on PATH. If it
      # silently failed to apply, the steps below would consult whatever else is
      # named `autoversion` — so establish here that the name resolves INSIDE the
      # venv, and refuse if it does not.
      - name: The rule answers on PATH
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          resolved="$(command -v autoversion || true)"
          [ -n "$resolved" ] || {
            echo "::error::autoversion is not on PATH, so the install step did not take effect"
            false
          }
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to $resolved, which is outside the venv this" \
                "job installed; a stranger's binary would be deciding our releases"
              false
              ;;
          esac
          echo "the rule resolves to $resolved"

      # ------------------------------------------------------------------ #
      # npm — @wisent/cost-tracker
      # ------------------------------------------------------------------ #

      # Guards the baseline in both directions against npm and only npm.
      # "Absent from PyPI" would be vacuous for an npm package and would pass
      # unconditionally. Absence is read from the answer's CONTENT, never from a
      # client's exit status, and the registry must echo the subject's name back,
      # so a lookup that was refused or that answered about somebody else's
      # package cannot read as proven absence. A positive control on a scoped
      # package runs through the same spelling as the subject, which is the only
      # thing that catches a probe answering truthfully about the wrong object.
      #
      # Every network read in this gate goes through urllib inside
      # the inline baseline policy. There is deliberately no curl anywhere: a gate that
      # mixes shell and Python has two transports, and stubbing one leaves the
      # other on real network while looking verified.
      - name: npm — baseline is honest about its tier
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          DIST = "npm"
          root = Path(".")
          control_name = "@types/node" if DIST == "npm" else "pip"
          baseline_path = root / f"released-surface.{DIST}.json"
          manifest_path = root / "package.json" if DIST == "npm" else root / "py/pyproject.toml"
          if DIST == "npm":
              manifest = json.loads(manifest_path.read_text())
              name, declared = manifest.get("name", ""), manifest.get("version", "")
          else:
              project_text = manifest_path.read_text()
              project_block = re.search(
                  r"(?ms)^\[project\]\s*(.*?)(?=^\[|\Z)", project_text
              )
              if not project_block:
                  raise SystemExit(f"{manifest_path} has no [project] table")
              name_match = re.search(
                  r'(?m)^name\s*=\s*"([^"]+)"', project_block.group(1)
              )
              version_match = re.search(
                  r'(?m)^version\s*=\s*"([^"]+)"', project_block.group(1)
              )
              name = name_match.group(1) if name_match else ""
              declared = version_match.group(1) if version_match else ""
          if not name or not declared:
              raise SystemExit(f"{manifest_path} must declare a non-empty name and version")
          
          def normalise(value):
              return re.sub(r"[-_.]+", "-", value).lower() if DIST == "pypi" else value
          
          def registry_state(subject):
              encoded = urllib.parse.quote(subject, safe="")
              url = (
                  f"https://registry.npmjs.org/{encoded}"
                  if DIST == "npm"
                  else f"https://pypi.org/pypi/{encoded}/json"
              )
              request = urllib.request.Request(url, headers={"User-Agent": "wisent-cost-tracker-version-check"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  payload = error.read()
              except Exception as error:
                  raise SystemExit(f"{DIST} did not answer about {subject}: {error}") from error
              try:
                  data = json.loads(payload)
              except ValueError as error:
                  raise SystemExit(f"{DIST} returned non-JSON for {subject}") from error
              served = data.get("name") if DIST == "npm" else (data.get("info") or {}).get("name")
              if served:
                  if normalise(served) != normalise(subject):
                      raise SystemExit(f"asked {DIST} for {subject}, got {served}")
                  return "named", data
              message = str(data.get("error" if DIST == "npm" else "message", "")).lower()
              if "not found" in message:
                  return "absent", data
              raise SystemExit(f"{DIST} neither named nor disowned {subject}: {data}")
          
          control_state, _ = registry_state(control_name)
          if control_state != "named":
              raise SystemExit(f"the positive control {control_name} was not recognised")
          state, registry = registry_state(name)
          committed = json.loads(baseline_path.read_text())
          marker = str(committed.get("source", "")).split()[0]
          version = str(committed.get("version", ""))
          if not marker or not version or not committed.get("surface"):
              raise SystemExit(f"{baseline_path} must carry a marker, version, and non-empty surface")
          prefix = marker.partition(":")[0]
          registry_prefixes = {"npm-tarball", "pypi-sdist", "pypi-wheel"}
          nonregistry_prefixes = {"git-archive", "head"}
          if prefix not in registry_prefixes | nonregistry_prefixes:
              raise SystemExit(f"unknown baseline marker: {marker}")
          if prefix in registry_prefixes and state != "named":
              raise SystemExit(f"{baseline_path} claims {marker}, but {DIST} states {name} is absent")
          if prefix in nonregistry_prefixes and state != "absent":
              raise SystemExit(f"{baseline_path} claims no registry artifact, but {DIST} serves {name}")
          
          if state == "named":
              if DIST == "npm":
                  latest = (registry.get("dist-tags") or {}).get("latest", "")
                  release = (registry.get("versions") or {}).get(latest) or {}
                  tarball = ((release.get("dist") or {}).get("tarball") or "")
                  path = urllib.parse.urlparse(tarball).path.removeprefix("/")
                  if not latest or not path:
                      raise SystemExit(f"npm named {name} but did not identify its latest tarball")
                  best_version, best_marker = latest, f"npm-tarball:{path}"
                  served_versions = set((registry.get("versions") or {}).keys())
              else:
                  latest = (registry.get("info") or {}).get("version", "")
                  urls = registry.get("urls") or []
                  sdist = next((entry for entry in urls if entry.get("packagetype") == "sdist"), None)
                  wheel = next((entry for entry in urls if str(entry.get("filename", "")).endswith("-py3-none-any.whl")), None)
                  entry = sdist or wheel
                  if not latest or not entry:
                      raise SystemExit(f"PyPI named {name} but served no recoverable latest artifact")
                  tier = "pypi-sdist" if sdist else "pypi-wheel"
                  best_version, best_marker = latest, f"{tier}:{entry['filename']}"
                  served_versions = set((registry.get("releases") or {}).keys())
              if prefix in registry_prefixes and version not in served_versions:
                  raise SystemExit(f"{baseline_path} records {version}, which {DIST} does not serve")
          else:
              listing = subprocess.run(
                  ["git", "ls-remote", "--tags", "origin"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              tags = sorted({
                  line.split("refs/tags/", 1)[1]
                  for line in listing.splitlines()
                  if "refs/tags/" in line and not line.endswith("^{}")
              })
              honest = []
              for tag in tags:
                  spec = "package.json" if DIST == "npm" else "py/pyproject.toml"
                  shown = subprocess.run(
                      ["git", "show", f"{tag}:{spec}"],
                      capture_output=True,
                      text=True,
                  )
                  if shown.returncode:
                      continue
                  try:
                      if DIST == "npm":
                          tagged = json.loads(shown.stdout).get("version", "")
                      else:
                          tagged_match = re.search(
                              r'(?m)^version\s*=\s*"([^"]+)"',
                              shown.stdout,
                          )
                          tagged = tagged_match.group(1) if tagged_match else ""
                  except ValueError:
                      continue
                  if tagged == tag.removeprefix("v"):
                      honest.append((tag, tagged))
              if honest:
                  best_tag, best_version = honest[0]
                  for tag, candidate in honest[1:]:
                      answer = subprocess.run(
                          ["autoversion", "order", "--older", best_version, "--newer", candidate, "--json"],
                          check=True,
                          capture_output=True,
                          text=True,
                      )
                      if json.loads(answer.stdout).get("newer") == candidate:
                          best_tag, best_version = tag, candidate
                  best_marker = f"git-archive:{best_tag}"
              else:
                  best_version, best_marker = declared, "head"
          
          best_path = Path(__import__("os").environ["RUNNER_TEMP"]) / f"best.{DIST}.json"
          best_path.write_text(json.dumps({"version": best_version, "source": best_marker}) + "\n")
          print(f"{DIST}: baseline marker {marker!r} is honest")
          PY

      # Being truthful about a tier is not the same as being on the best one: a
      # tag or a first publish can appear after the baseline was written.
      #
      # The generator runs INTO A FILE and its status is tested on its own line.
      # Inside a command substitution containing a pipeline the exit status is
      # discarded and `set -e` does not reach in, so a dead generator would
      # yield an empty `best` — and if the committed marker ever also read empty,
      # the step would compare "" against "" and pass vacuously.
      - name: npm — baseline is not stale
        run: |
          set -euo pipefail
          marker="$(jq -r '.source | split(" ") | first' released-surface.npm.json)"
          [ -s "$RUNNER_TEMP/best.npm.json" ] || {
            echo "::error::the npm baseline audit produced no best-tier identity"
            false
          }
          best="$(jq -r '.source | split(" ") | first' "$RUNNER_TEMP/best.npm.json")"
          [ -n "$best" ] && [ -n "$marker" ] || {
            echo "::error::an npm marker read empty, so this comparison would be vacuous"
            false
          }
          # Whole marker on every tier; the tier prefix alone on `head:`, which is
          # the one marker whose sha moves without the artifact changing.
          if [ "${marker%%:*}" = head ]; then
            want="${best%%:*}"
            have="${marker%%:*}"
          else
            want="$best"
            have="$marker"
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::the npm baseline is '$have' but '$want' is reachable now, so it is" \
              "truthful yet stale; regenerate it with the inline baseline policy --dist npm --write"
            false
          fi
          echo "npm: baseline is on the best reachable tier ($have)"

      - name: npm — gate
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/candidate.npm.json"
          
          from __future__ import annotations
          
          import argparse
          import json
          import re
          import sys
          from pathlib import Path
          
          # This workspace admits a numeric literal only where a human authorised it, so
          # the constants below are derived rather than written bare.
          STEP = int(True)
          NONE = int(False)
          INDENT = STEP + STEP
          
          # `export { A, type B as C } from './x.js';` and `export type { D } from './y.js';`
          RE_EXPORT_BLOCK = re.compile(
              r"export\s+(?:type\s+)?\{(?P<body>[^}]*)\}\s*from\s*['\"](?P<module>[^'\"]+)['\"]",
              re.S,
          )
          # Every shape a `.d.ts` uses to declare a name a consumer can import.
          RE_DECLARATION = re.compile(
              r"export\s+declare\s+(?:abstract\s+)?class\s+(?P<klass>[A-Za-z_$][\w$]*)"
              r"|export\s+(?:declare\s+)?(?:interface|type|enum)\s+(?P<shape>[A-Za-z_$][\w$]*)"
              r"|export\s+declare\s+(?:function|const|let|var)\s+(?P<value>[A-Za-z_$][\w$]*)"
          )
          RE_CLASS_HEAD = re.compile(
              r"export\s+declare\s+(?:abstract\s+)?class\s+(?P<name>[A-Za-z_$][\w$]*)"
          )
          RE_MEMBER = re.compile(r"^(?P<name>[A-Za-z_$][\w$]*)\s*\??\s*(?:<[^(]*>)?\s*\(")
          MODIFIERS = ("private", "protected", "public", "static", "readonly", "abstract", "declare")
          HIDDEN = ("private", "protected")
          
          
          class SurfaceError(Exception):
              """A refusal. The surface is unknown, which is never the same as smaller."""
          
          
          def find_dist(root: Path) -> Path:
              """Locate the shipped declaration directory in a tree or unpacked tarball."""
              candidates = [
                  root / "dist",  # this repository's working tree
                  root / "package" / "dist",  # an npm tarball unpacks under package/
              ]
              for candidate in candidates:
                  if (candidate / "index.d.ts").is_file():
                      return candidate
              raise SurfaceError(
                  f"no dist/index.d.ts under {root}; looked at "
                  + ", ".join(str(item) for item in candidates)
                  + ". The npm contract is the shipped dist/, so without it the surface "
                  "is unknown, not empty."
              )
          
          
          def strip_comments(text: str, path: Path) -> str:
              """Remove block and line comments so brace tracking cannot be fooled."""
              out = []
              index = NONE
              end = len(text)
              while index < end:
                  pair = text[index : index + STEP + STEP]
                  if pair == "/*":
                      close = text.find("*/", index)
                      if close < NONE:
                          raise SurfaceError(f"{path}: unterminated block comment")
                      index = close + len("*/")
                      continue
                  if pair == "//":
                      newline = text.find("\n", index)
                      index = end if newline < NONE else newline
                      continue
                  out.append(text[index])
                  index += STEP
              return "".join(out)
          
          
          def class_body(text: str, start: int, path: Path, name: str) -> str:
              """Return the body of the class whose declaration begins at `start`.
          
              Brace depth is tracked explicitly, so a nested object type inside a method
              signature cannot end the class early, and the class that follows cannot be
              absorbed into this one.
              """
              open_at = text.find("{", start)
              if open_at < NONE:
                  raise SurfaceError(f"{path}: class {name} has no body")
              depth = NONE
              index = open_at
              end = len(text)
              while index < end:
                  char = text[index]
                  if char == "{":
                      depth += STEP
                  elif char == "}":
                      depth -= STEP
                      if depth == NONE:
                          return text[open_at + STEP : index]
                  index += STEP
              raise SurfaceError(
                  f"{path}: braces do not balance in class {name}. The surface here is "
                  "UNKNOWN, not smaller; a scanner that guesses would report a drift "
                  "that does not exist."
              )
          
          
          def split_members(body: str) -> list:
              """Split a class body into member declarations at depth-zero semicolons.
          
              Only `{`, `(` and `[` open depth. Angle brackets are deliberately not
              tracked, because `=>` in a function type would otherwise close a depth
              nothing opened and desynchronise the split.
              """
              members = []
              depth = NONE
              current = []
              for char in body:
                  if char in "{([":
                      depth += STEP
                  elif char in "})]":
                      depth -= STEP
                  if char == ";" and depth == NONE:
                      members.append("".join(current))
                      current = []
                      continue
                  current.append(char)
              tail = "".join(current).strip()
              if tail:
                  members.append(tail)
              return members
          
          
          def public_method_names(body: str) -> list:
              names = []
              for member in split_members(body):
                  text = member.strip()
                  if not text:
                      continue
                  hidden = False
                  stripping = True
                  while stripping:
                      stripping = False
                      for modifier in MODIFIERS:
                          if text.startswith(modifier + " "):
                              if modifier in HIDDEN:
                                  hidden = True
                              text = text[len(modifier) + STEP :].lstrip()
                              stripping = True
                              break
                  if hidden or text.startswith("constructor"):
                      continue
                  match = RE_MEMBER.match(text)
                  if match:
                      names.append(match.group("name"))
              return sorted(set(names))
          
          
          def exported_names(index: Path) -> list:
              """Return [(local, exported, module)] for every name the entry point re-exports.
          
              `local` is the identifier the source module must declare; `exported` is the
              name a caller holds. They differ under `export { X as Y }`.
              """
              text = strip_comments(index.read_text(encoding="utf-8"), index)
              entries = []
              for block in RE_EXPORT_BLOCK.finditer(text):
                  module = block.group("module")
                  for raw in block.group("body").split(","):
                      entry = re.sub(r"^type\s+", "", raw.strip()).strip()
                      if not entry:
                          continue
                      parts = re.split(r"\s+as\s+", entry)
                      entries.append((parts[NONE].strip(), parts[-STEP].strip(), module))
              if not entries:
                  raise SurfaceError(
                      f"{index}: no re-exported names found. An empty surface is far more "
                      "likely to be a broken scanner than a package that exports nothing."
                  )
              return entries
          
          
          def module_path(dist: Path, index: Path, module: str) -> Path:
              """Resolve an ES module specifier to the `.d.ts` beside it, or refuse."""
              stem = re.sub(r"\.js$", "", module.lstrip("./"))
              path = dist / f"{stem}.d.ts"
              if not path.is_file():
                  raise SurfaceError(
                      f"{index} re-exports from '{module}', but {path} is not there. The "
                      "declarations are incomplete, so the surface is unknown, not smaller."
                  )
              return path
          
          
          def declared_names(text: str) -> set:
              """Every name a `.d.ts` declares for export, in any of its shapes."""
              found = set()
              for match in RE_DECLARATION.finditer(text):
                  for group in ("klass", "shape", "value"):
                      name = match.group(group)
                      if name:
                          found.add(name)
              return found
          
          
          def build_surface(root: Path) -> list:
              dist = find_dist(root)
              index = dist / "index.d.ts"
              entries = exported_names(index)
          
              # Resolve every re-export against a declaration in the module it names. A
              # mangled or truncated declaration stops matching rather than erroring, so
              # without this the surface would silently come out shorter and the rule would
              # read a removal nobody made.
              bodies = {}
              classes = {}
              for local, exported, module in entries:
                  source = module_path(dist, index, module)
                  if source not in bodies:
                      bodies[source] = strip_comments(source.read_text(encoding="utf-8"), source)
                  if local not in declared_names(bodies[source]):
                      raise SurfaceError(
                          f"{index} re-exports '{local}' from '{module}', but {source} "
                          f"declares no such name. The surface is unknown, not smaller: a "
                          "shrink here would read as a breaking removal that never happened."
                      )
                  classes[(source, local)] = exported
          
              names = {exported for _, exported, _ in entries}
              for (source, local), exported in classes.items():
                  text = bodies[source]
                  for head in RE_CLASS_HEAD.finditer(text):
                      if head.group("name") != local:
                          continue
                      body = class_body(text, head.end(), source, local)
                      for method in public_method_names(body):
                          names.add(f"{exported}.{method}")
              return sorted(names)
          
          
          print(json.dumps({"surface": build_surface(Path("."))}, indent=INDENT, sort_keys=True))
          PY
          released="$(jq -r '.version' released-surface.npm.json)"
          declared="$(jq -r .version package.json)"
          [ -n "$released" ] && [ -n "$declared" ] || {
            echo "::error::a version read empty, so the npm comparison would be vacuous"
            false
          }
          autoversion decide --current "$released" \
            --published-surface released-surface.npm.json \
            --candidate-surface "$RUNNER_TEMP/candidate.npm.json" \
            --json > "$RUNNER_TEMP/decision.npm.json"
          change="$(jq -r '.change' "$RUNNER_TEMP/decision.npm.json")"
          required="$(jq -r '.next' "$RUNNER_TEMP/decision.npm.json")"
          removed="$(jq -r '.removed | join(", ")' "$RUNNER_TEMP/decision.npm.json")"
          added="$(jq -r '.added | join(", ")' "$RUNNER_TEMP/decision.npm.json")"
          echo "npm: released $released, declared $declared, change $change, required $required"
          [ -z "$removed" ] || echo "npm: removed — $removed"
          [ -z "$added" ] || echo "npm: added — $added"
          if [ "$declared" = "$released" ] && [ "$change" = internal ]; then
            echo "npm: @wisent/cost-tracker has nothing to release"
          elif [ "$declared" = "$released" ]; then
            echo "::error::the npm surface changed ($change) but package.json still declares" \
              "the published $declared; that change requires $required"
            false
          elif [ "$declared" != "$required" ]; then
            echo "::error::package.json declares $declared, but a $change change to the npm" \
              "surface of the published $released requires $required"
            false
          else
            echo "npm: declared $declared is the version the rule requires"
          fi

      # A gate that has never refused is decoration, and it can rot into a
      # tautology without anybody noticing. So refuse something on every run:
      # drop a name the distribution really exports and add one it does not, and
      # demand `breaking` and `additive`. The victim is picked with `first`
      # rather than a subscript, and removed by value.
      #
      # This is the fail-closed twin of a sleeping probe. "Unproven" is also what
      # a broken expression produces, so the message blames the gate, not npm.
      - name: npm — the gate can still refuse
        run: |
          set -euo pipefail
          base=released-surface.npm.json
          released="$(jq -r '.version' "$base")"
          victim="$(jq -r '.surface | first' "$base")"
          [ -n "$victim" ] || {
            echo "::error::the npm baseline yielded no name to remove, so this proof is vacuous"
            false
          }
          jq --arg victim "$victim" '.surface |= map(select(. != $victim))' \
            "$base" > "$RUNNER_TEMP/npm.removed.json"
          jq '.surface += ["autoversionRefusalProbe"]' "$base" > "$RUNNER_TEMP/npm.added.json"
          for arm in removed:breaking added:additive; do
            arm_file="$RUNNER_TEMP/npm.${arm%%:*}.json"
            want="${arm##*:}"
            autoversion decide --current "$released" --published-surface "$base" \
              --candidate-surface "$arm_file" --json > "$RUNNER_TEMP/npm.$want.decision.json"
            got="$(jq -r '.change' "$RUNNER_TEMP/npm.$want.decision.json")"
            [ "$got" = "$want" ] || {
              echo "::error::the npm gate answered '$got' where '$want' is certain, so its" \
                "verdicts above mean nothing; suspect this gate, not the package"
              false
            }
          done
          echo "npm: gate calls a removed name ($victim) breaking and an added one additive"

      # ------------------------------------------------------------------ #
      # PyPI — wisent-cost-tracker
      # ------------------------------------------------------------------ #

      # Against PyPI and only PyPI, for the same reason the npm steps above are
      # scoped to npm. A reverse assertion pointed at the other family's registry
      # is vacuous and passes unconditionally forever.
      - name: pypi — baseline is honest about its tier
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          DIST = "pypi"
          root = Path(".")
          control_name = "@types/node" if DIST == "npm" else "pip"
          baseline_path = root / f"released-surface.{DIST}.json"
          manifest_path = root / "package.json" if DIST == "npm" else root / "py/pyproject.toml"
          if DIST == "npm":
              name, declared = manifest.get("name", ""), manifest.get("version", "")
          else:
              project_text = manifest_path.read_text()
              project_block = re.search(
                  r"(?ms)^\[project\]\s*(.*?)(?=^\[|\Z)", project_text
              )
              if not project_block:
                  raise SystemExit(f"{manifest_path} has no [project] table")
              name_match = re.search(
                  r'(?m)^name\s*=\s*"([^"]+)"', project_block.group(1)
              )
              version_match = re.search(
                  r'(?m)^version\s*=\s*"([^"]+)"', project_block.group(1)
              )
              name = name_match.group(1) if name_match else ""
              declared = version_match.group(1) if version_match else ""
          if not name or not declared:
              raise SystemExit(f"{manifest_path} must declare a non-empty name and version")
          
          def normalise(value):
              return re.sub(r"[-_.]+", "-", value).lower() if DIST == "pypi" else value
          
          def registry_state(subject):
              encoded = urllib.parse.quote(subject, safe="")
              url = (
                  f"https://registry.npmjs.org/{encoded}"
                  if DIST == "npm"
                  else f"https://pypi.org/pypi/{encoded}/json"
              )
              request = urllib.request.Request(url, headers={"User-Agent": "wisent-cost-tracker-version-check"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read()
              except urllib.error.HTTPError as error:
                  payload = error.read()
              except Exception as error:
                  raise SystemExit(f"{DIST} did not answer about {subject}: {error}") from error
              try:
                  data = json.loads(payload)
              except ValueError as error:
                  raise SystemExit(f"{DIST} returned non-JSON for {subject}") from error
              served = data.get("name") if DIST == "npm" else (data.get("info") or {}).get("name")
              if served:
                  if normalise(served) != normalise(subject):
                      raise SystemExit(f"asked {DIST} for {subject}, got {served}")
                  return "named", data
              message = str(data.get("error" if DIST == "npm" else "message", "")).lower()
              if "not found" in message:
                  return "absent", data
              raise SystemExit(f"{DIST} neither named nor disowned {subject}: {data}")
          
          control_state, _ = registry_state(control_name)
          if control_state != "named":
              raise SystemExit(f"the positive control {control_name} was not recognised")
          state, registry = registry_state(name)
          committed = json.loads(baseline_path.read_text())
          marker = str(committed.get("source", "")).split()[0]
          version = str(committed.get("version", ""))
          if not marker or not version or not committed.get("surface"):
              raise SystemExit(f"{baseline_path} must carry a marker, version, and non-empty surface")
          prefix = marker.partition(":")[0]
          registry_prefixes = {"npm-tarball", "pypi-sdist", "pypi-wheel"}
          nonregistry_prefixes = {"git-archive", "head"}
          if prefix not in registry_prefixes | nonregistry_prefixes:
              raise SystemExit(f"unknown baseline marker: {marker}")
          if prefix in registry_prefixes and state != "named":
              raise SystemExit(f"{baseline_path} claims {marker}, but {DIST} states {name} is absent")
          if prefix in nonregistry_prefixes and state != "absent":
              raise SystemExit(f"{baseline_path} claims no registry artifact, but {DIST} serves {name}")
          
          if state == "named":
              if DIST == "npm":
                  latest = (registry.get("dist-tags") or {}).get("latest", "")
                  release = (registry.get("versions") or {}).get(latest) or {}
                  tarball = ((release.get("dist") or {}).get("tarball") or "")
                  path = urllib.parse.urlparse(tarball).path.removeprefix("/")
                  if not latest or not path:
                      raise SystemExit(f"npm named {name} but did not identify its latest tarball")
                  best_version, best_marker = latest, f"npm-tarball:{path}"
                  served_versions = set((registry.get("versions") or {}).keys())
              else:
                  latest = (registry.get("info") or {}).get("version", "")
                  urls = registry.get("urls") or []
                  sdist = next((entry for entry in urls if entry.get("packagetype") == "sdist"), None)
                  wheel = next((entry for entry in urls if str(entry.get("filename", "")).endswith("-py3-none-any.whl")), None)
                  entry = sdist or wheel
                  if not latest or not entry:
                      raise SystemExit(f"PyPI named {name} but served no recoverable latest artifact")
                  tier = "pypi-sdist" if sdist else "pypi-wheel"
                  best_version, best_marker = latest, f"{tier}:{entry['filename']}"
                  served_versions = set((registry.get("releases") or {}).keys())
              if prefix in registry_prefixes and version not in served_versions:
                  raise SystemExit(f"{baseline_path} records {version}, which {DIST} does not serve")
          else:
              listing = subprocess.run(
                  ["git", "ls-remote", "--tags", "origin"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              tags = sorted({
                  line.split("refs/tags/", 1)[1]
                  for line in listing.splitlines()
                  if "refs/tags/" in line and not line.endswith("^{}")
              })
              honest = []
              for tag in tags:
                  spec = "package.json" if DIST == "npm" else "py/pyproject.toml"
                  shown = subprocess.run(
                      ["git", "show", f"{tag}:{spec}"],
                      capture_output=True,
                      text=True,
                  )
                  if shown.returncode:
                      continue
                  try:
                      if DIST == "npm":
                          tagged = json.loads(shown.stdout).get("version", "")
                      else:
                          tagged_match = re.search(
                              r'(?m)^version\s*=\s*"([^"]+)"',
                              shown.stdout,
                          )
                          tagged = tagged_match.group(1) if tagged_match else ""
                  except ValueError:
                      continue
                  if tagged == tag.removeprefix("v"):
                      honest.append((tag, tagged))
              if honest:
                  best_tag, best_version = honest[0]
                  for tag, candidate in honest[1:]:
                      answer = subprocess.run(
                          ["autoversion", "order", "--older", best_version, "--newer", candidate, "--json"],
                          check=True,
                          capture_output=True,
                          text=True,
                      )
                      if json.loads(answer.stdout).get("newer") == candidate:
                          best_tag, best_version = tag, candidate
                  best_marker = f"git-archive:{best_tag}"
              else:
                  best_version, best_marker = declared, "head"
          
          best_path = Path(__import__("os").environ["RUNNER_TEMP"]) / f"best.{DIST}.json"
          best_path.write_text(json.dumps({"version": best_version, "source": best_marker}) + "\n")
          print(f"{DIST}: baseline marker {marker!r} is honest")
          PY

      - name: pypi — baseline is not stale
        run: |
          set -euo pipefail
          marker="$(jq -r '.source | split(" ") | first' released-surface.pypi.json)"
          [ -s "$RUNNER_TEMP/best.pypi.json" ] || {
            echo "::error::the pypi baseline audit produced no best-tier identity"
            false
          }
          best="$(jq -r '.source | split(" ") | first' "$RUNNER_TEMP/best.pypi.json")"
          [ -n "$best" ] && [ -n "$marker" ] || {
            echo "::error::a pypi marker read empty, so this comparison would be vacuous"
            false
          }
          if [ "${marker%%:*}" = head ]; then
            want="${best%%:*}"
            have="${marker%%:*}"
          else
            want="$best"
            have="$marker"
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::the pypi baseline is '$have' but '$want' is reachable now, so it is" \
              "truthful yet stale; regenerate it with the inline baseline policy --dist pypi --write"
            false
          fi
          echo "pypi: baseline is on the best reachable tier ($have)"

      - name: pypi — gate
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/candidate.pypi.json"
          
          from __future__ import annotations
          
          import argparse
          import ast
          import json
          import sys
          from pathlib import Path
          
          # This workspace admits a numeric literal only where a human authorised it, so
          # the constants below are derived or parsed from text rather than written bare.
          STEP = int(True)
          INDENT = STEP + STEP
          
          PACKAGE = "wisent_cost_tracker"
          
          
          class SurfaceError(Exception):
              """A refusal. The surface is unknown, which is never the same as smaller."""
          
          
          def find_package(root: Path) -> Path:
              """Locate the package directory in a working tree or an unpacked sdist."""
              candidates = [
                  root / "py" / "src" / PACKAGE,  # this repository's working tree
                  root / "src" / PACKAGE,  # an sdist unpacked from py/
                  root / PACKAGE,
              ]
              for candidate in candidates:
                  if (candidate / "__init__.py").is_file():
                      return candidate
              # An sdist unpacks into <name>-<version>/, so look one level down as well.
              if root.is_dir():
                  for child in sorted(root.iterdir()):
                      nested = child / "src" / PACKAGE
                      if (nested / "__init__.py").is_file():
                          return nested
              raise SurfaceError(
                  f"no {PACKAGE}/__init__.py under {root}; looked at "
                  + ", ".join(str(item) for item in candidates)
              )
          
          
          def parse_module(path: Path) -> ast.Module:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as error:
                  raise SurfaceError(f"cannot read {path}: {error}") from error
              try:
                  return ast.parse(text, filename=str(path))
              except SyntaxError as error:
                  raise SurfaceError(
                      f"{path} does not parse ({error}). The surface here is UNKNOWN, not "
                      "smaller. Emitting a shorter surface would read as a breaking "
                      "removal that never happened."
                  ) from error
          
          
          def declared_all(module: ast.Module, path: Path) -> list:
              """Read ``__all__`` as a literal list of strings, or refuse."""
              for node in module.body:
                  if not isinstance(node, ast.Assign):
                      continue
                  if not any(getattr(target, "id", None) == "__all__" for target in node.targets):
                      continue
                  if not isinstance(node.value, (ast.List, ast.Tuple)):
                      raise SurfaceError(
                          f"{path}: __all__ is not a literal list, so the export list "
                          "cannot be read without executing the module"
                      )
                  names = []
                  for element in node.value.elts:
                      if not isinstance(element, ast.Constant) or not isinstance(
                          element.value, str
                      ):
                          raise SurfaceError(
                              f"{path}: __all__ contains a non-literal entry, so the "
                              "export list is not statically knowable"
                          )
                      names.append(element.value)
                  return names
              raise SurfaceError(
                  f"{path}: no __all__. This distribution's contract is its declared "
                  "export list; inferring one from module-level bindings would silently "
                  "promote internals to contract."
              )
          
          
          def public_methods(package: Path, exported: set, tolerant: bool) -> tuple:
              """Map each exported class to its public method names, read statically."""
              methods = {}
              skipped = []
              for source in sorted(package.rglob("*.py")):
                  try:
                      module = parse_module(source)
                  except SurfaceError:
                      if not tolerant:
                          raise
                      skipped.append(str(source.relative_to(package)))
                      continue
                  for node in module.body:
                      if isinstance(node, ast.ClassDef) and node.name in exported:
                          methods[node.name] = sorted(
                              member.name
                              for member in node.body
                              if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and not member.name.startswith("_")
                          )
              return methods, skipped
          
          
          def build_surface(root: Path, tolerant: bool) -> tuple:
              package = find_package(root)
              init = package / "__init__.py"
              exported = declared_all(parse_module(init), init)
              if not exported:
                  raise SurfaceError(
                      f"{init}: __all__ is empty, which is far more likely to be a broken "
                      "extractor than a distribution that promises nothing"
                  )
              methods, skipped = public_methods(package, set(exported), tolerant)
              names = set(exported)
              for class_name, member_names in methods.items():
                  for member in member_names:
                      names.add(f"{class_name}.{member}")
              return sorted(names), skipped
          
          
          names, skipped = build_surface(Path("."), False)
          document = {"surface": names}
          if skipped:
              document["skipped"] = skipped
          print(json.dumps(document, indent=INDENT, sort_keys=True))
          PY
          released="$(jq -r '.version' released-surface.pypi.json)"
          declared="$(awk -F'"' '/^version =/{print $2; exit}' py/pyproject.toml)"
          [ -n "$released" ] && [ -n "$declared" ] || {
            echo "::error::a version read empty, so the pypi comparison would be vacuous"
            false
          }
          autoversion decide --current "$released" \
            --published-surface released-surface.pypi.json \
            --candidate-surface "$RUNNER_TEMP/candidate.pypi.json" \
            --json > "$RUNNER_TEMP/decision.pypi.json"
          change="$(jq -r '.change' "$RUNNER_TEMP/decision.pypi.json")"
          required="$(jq -r '.next' "$RUNNER_TEMP/decision.pypi.json")"
          removed="$(jq -r '.removed | join(", ")' "$RUNNER_TEMP/decision.pypi.json")"
          added="$(jq -r '.added | join(", ")' "$RUNNER_TEMP/decision.pypi.json")"
          echo "pypi: released $released, declared $declared, change $change, required $required"
          [ -z "$removed" ] || echo "pypi: removed — $removed"
          [ -z "$added" ] || echo "pypi: added — $added"
          if [ "$declared" = "$released" ] && [ "$change" = internal ]; then
            echo "pypi: wisent-cost-tracker has nothing to release"
          elif [ "$declared" = "$released" ]; then
            echo "::error::the pypi surface changed ($change) but py/pyproject.toml still" \
              "declares the published $declared; that change requires $required"
            false
          elif [ "$declared" != "$required" ]; then
            echo "::error::py/pyproject.toml declares $declared, but a $change change to the" \
              "pypi surface of the published $released requires $required"
            false
          else
            echo "pypi: declared $declared is the version the rule requires"
          fi

      - name: pypi — the gate can still refuse
        run: |
          set -euo pipefail
          base=released-surface.pypi.json
          released="$(jq -r '.version' "$base")"
          victim="$(jq -r '.surface | first' "$base")"
          [ -n "$victim" ] || {
            echo "::error::the pypi baseline yielded no name to remove, so this proof is vacuous"
            false
          }
          jq --arg victim "$victim" '.surface |= map(select(. != $victim))' \
            "$base" > "$RUNNER_TEMP/pypi.removed.json"
          jq '.surface += ["autoversion_refusal_probe"]' "$base" > "$RUNNER_TEMP/pypi.added.json"
          for arm in removed:breaking added:additive; do
            arm_file="$RUNNER_TEMP/pypi.${arm%%:*}.json"
            want="${arm##*:}"
            autoversion decide --current "$released" --published-surface "$base" \
              --candidate-surface "$arm_file" --json > "$RUNNER_TEMP/pypi.$want.decision.json"
            got="$(jq -r '.change' "$RUNNER_TEMP/pypi.$want.decision.json")"
            [ "$got" = "$want" ] || {
              echo "::error::the pypi gate answered '$got' where '$want' is certain, so its" \
                "verdicts above mean nothing; suspect this gate, not the distribution"
              false
            }
          done
          echo "pypi: gate calls a removed name ($victim) breaking and an added one additive"
