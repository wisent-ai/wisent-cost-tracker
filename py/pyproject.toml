[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisent-cost-tracker"
version = "0.1.0"
description = "Per-agent cost tracking and budget enforcement (Python client)."
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Wisent" }]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
wisent-cost-tracker-onboarding = "wisent_cost_tracker.onboarding:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wisent_cost_tracker = ["pricing/*.json"]

# The Python tests live in the repository's tests/ directory and are run from
# here, with `pytest` in py/. pythonpath puts the package under test on the
# import path, so no test file patches sys.path and no editable install is
# needed to run them.
[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]
