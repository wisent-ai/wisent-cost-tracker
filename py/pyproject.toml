[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "wisent-cost-tracker"
version = "0.1.1"
description = "Per-agent cost tracking and budget enforcement (Python client)."
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Wisent" }]
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
wisent-cost-tracker-onboarding = "wisent_cost_tracker.onboarding:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wisent_cost_tracker = ["pricing/*.json"]

[[tool.setuptools-rust.ext-modules]]
target = "wisent_cost_tracker.spend"
path = "Cargo.toml"
binding = "PyO3"
cargo_manifest_args = ["--locked"]

[[tool.setuptools-rust.ext-modules]]
target = "wisent_cost_tracker.onboarding.engine.control_plane"
path = "control-plane/Cargo.toml"
binding = "PyO3"
cargo_manifest_args = ["--locked"]
