[package]
name = "wisent-cost-tracker-spend"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "spend"
path = "native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.1", features = ["extension-module", "abi3-py311", "multiple-pymethods"] }
tempfile = "3"

[workspace]
members = ["control-plane"]
resolver = "2"
